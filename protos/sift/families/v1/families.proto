// Request for `FamilyService.ListFamilyCandidateRuns`.
//
// The CEL filter supports the standard run filter fields plus an
// `include_archived` directive. Archived runs are excluded by default; pass
// `include_archived == true` in the filter to include them.
//
// When `family_id` is set, the server filters out runs already on that
// family's persisted membership (both included and excluded entries) so the
// response only contains runs not yet on the family. Clients editing an
// unsaved draft of family membership should omit `family_id` and apply their
// own draft-aware filtering, since the persisted membership does not reflect
// the draft state.
message ListFamilyCandidateRunsRequest {
  // The maximum number of runs to return.
  // The service may return fewer than this value.
  // If unspecified, at most 50 runs will be returned.
  // The maximum value is 1000; values above 1000 will be coerced to 1000.
  uint32 page_size = 1 [(google.api.field_behavior) = OPTIONAL];

  // A page token, received from a previous call.
  // Provide this to retrieve the subsequent page.
  // When paginating, all other parameters provided must match
  // the call that provided the page token.
  string page_token = 2 [(google.api.field_behavior) = OPTIONAL];

  // A [Common Expression Language (CEL)](https://github.com/google/cel-spec) filter string.
  // Supports all ListRuns filter fields plus `include_archived`.
  // When `include_archived` is not present in the filter, archived runs are excluded by default.
  // Set `include_archived == true` in the filter to include archived runs.
  // Note: `include_archived` is a directive and must appear at the top level of the filter
  // (or within a top-level AND chain). It cannot be used inside an OR expression.
  string filter = 3 [(google.api.field_behavior) = OPTIONAL];

  // How to order the retrieved runs. Formatted as a comma-separated string i.e. "FIELD_NAME[ desc],...".
  // Available fields to order_by are `name`, `description`, `created_date`, `modified_date`, `start_time`, and `stop_time`.
  // If left empty, items are ordered by `created_date` in descending order (newest-first).
  string order_by = 4 [(google.api.field_behavior) = OPTIONAL];

  // Optional family ID to filter out runs already on the family's persisted membership.
  // When set, the response excludes runs that are already included or excluded in the family.
  // Omit this field when working with draft membership changes.
  string family_id = 5 [(google.api.field_behavior) = OPTIONAL];
}
message ListFamilyCandidateRunsResponse {
  repeated sift.runs.v2.Run runs = 1 [(google.api.field_behavior) = REQUIRED];
  string next_page_token = 2;
}

message GetFamilyCandidateRunFilterFieldsRequest {}

message GetFamilyCandidateRunFilterFieldsResponse {
  repeated sift.common.v1.FilterField filter_fields = 1;
}
