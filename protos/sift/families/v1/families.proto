// AbstractWindowType represents a window boundary that is agnostic of the alignment ID.
message AbstractWindowType {
  string family_alignment_name = 1 [(google.api.field_behavior) = OPTIONAL];
  // Duration relative to the alignment used to compare the data. Defaults to 0 seconds.
  google.protobuf.Duration duration = 2 [(google.api.field_behavior) = OPTIONAL];
}
message GenerateFamilyStatRangeNameRequest {
  string family_alignment_name = 1 [(google.api.field_behavior) = REQUIRED];
  AbstractWindowType window_start = 2 [(google.api.field_behavior) = REQUIRED];
  AbstractWindowType window_end = 3 [(google.api.field_behavior) = REQUIRED];
}

message GenerateFamilyStatRangeNameResponse {
  string name = 1 [(google.api.field_behavior) = REQUIRED];
}

message GetFamilyCandidateRunsRequest {
  string family_version_id = 1 [(google.api.field_behavior) = REQUIRED];
}

message GetFamilyCandidateRunsResponse {
  string run_query = 1 [(google.api.field_behavior) = REQUIRED];
