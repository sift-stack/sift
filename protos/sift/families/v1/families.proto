// ----------------------
// Family Stats
// ----------------------

message FamilyStat {
  string family_stat_id = 1 [
    (google.api.field_behavior) = OUTPUT_ONLY,
    (google.api.field_behavior) = REQUIRED
  ];
  // The family version id of the family stat.
  string family_version_id = 2 [
    (google.api.field_behavior) = OUTPUT_ONLY,
    (google.api.field_behavior) = REQUIRED
  ];
  // The name of the family stat.
  string name = 3 [(google.api.field_behavior) = REQUIRED];
  // The description of the family stat.
  string description = 4 [(google.api.field_behavior) = OPTIONAL];
  // The sample rate of the family stat (Hz).
  double sample_rate = 5 [(google.api.field_behavior) = REQUIRED];
  // Ordered list of channel names to include in the family stat.
  // The first channel name is the primary channel name across all the family members.
  // The remaining channel names are fallback channels or individual overrides when the primary channel
  // is not available across all the family members.
  repeated string default_channel_names = 6 [(google.api.field_behavior) = REQUIRED];
  google.protobuf.Timestamp created_date = 7 [
    (google.api.field_behavior) = OUTPUT_ONLY,
    (google.api.field_behavior) = REQUIRED
  ];
  google.protobuf.Timestamp modified_date = 8 [
    (google.api.field_behavior) = OUTPUT_ONLY,
    (google.api.field_behavior) = REQUIRED
  ];
  string created_by_user_id = 9 [
    (google.api.field_behavior) = OUTPUT_ONLY,
    (google.api.field_behavior) = REQUIRED
  ];
  string modified_by_user_id = 10 [
    (google.api.field_behavior) = OUTPUT_ONLY,
    (google.api.field_behavior) = REQUIRED
  ];
  string organization_id = 11 [
    (google.api.field_behavior) = OUTPUT_ONLY,
    (google.api.field_behavior) = REQUIRED
  ];
}

message FamilyStatExpression {
  string family_stat_expression_id = 1 [
    (google.api.field_behavior) = OUTPUT_ONLY,
    (google.api.field_behavior) = REQUIRED
  ];
  string family_stat_id = 2 [
    (google.api.field_behavior) = OUTPUT_ONLY,
    (google.api.field_behavior) = REQUIRED
  ];
  // The statistical expression to apply to the channels in the family stat.
  // The expression can be any of the following: AVG, MEDIAN, MIN, MAX, STDEV, SUM, INPUT_COUNT, SIGMA.
  // SIGMA is auto-managed by the backend: it is created only when both AVG and STDEV are present,
  // and fails when either is absent.
  oneof expression {
    google.protobuf.Empty avg = 3;
    google.protobuf.Empty median = 4;
    google.protobuf.Empty min = 5;
    google.protobuf.Empty max = 6;
    google.protobuf.Empty stdev = 7;
    google.protobuf.Empty sum = 8;
    google.protobuf.Empty input_count = 9;
    google.protobuf.Empty sigma = 10 [(google.api.field_behavior) = OUTPUT_ONLY];
  }
}

message FamilyStatChannel {
  string family_stat_channel_id = 1 [
    (google.api.field_behavior) = OUTPUT_ONLY,
    (google.api.field_behavior) = REQUIRED
  ];
  string family_stat_id = 2 [
    (google.api.field_behavior) = OUTPUT_ONLY,
    (google.api.field_behavior) = REQUIRED
  ];
  // The channel id of the channel to include in the family stat given the list of channel names provided in the family stat.
  string channel_id = 3 [(google.api.field_behavior) = REQUIRED];
  // Specific alignment point id of the family member / channel to include in the family stat.
  // When creating a family stat with a new Family, this field should contain the temporary_id
  // from FamilyAlignmentPoint.family_alignment_point_id. The service will resolve it to the actual alignment_point_id.
  // When updating a family stat, this field must contain the actual alignment_point_id.
  // This will be prevalent when multiple alignment points are supported for a given family member.
  string alignment_point_id = 4 [(google.api.field_behavior) = REQUIRED];
}

// WindowType represents a window boundary that can be either an alignment ID or a duration.
message WindowType {
  // Alignment ID to use as the window boundary.
  // When creating a family stat with a new Family, this field should contain the temporary_id
  // from FamilyAlignment.family_alignment_id. Default to the window's T-0 alignment.
  // The service will resolve it to the actual alignment ID.
  // When updating a family stat, this field must contain the actual family_alignment_id.
  string family_alignment_id = 1 [(google.api.field_behavior) = OPTIONAL];
  // Duration relative to the alignment used to compare the data. Defaults to 0 seconds.
  google.protobuf.Duration duration = 2 [(google.api.field_behavior) = OPTIONAL];
}

message FamilyStatRange {
  string family_stat_range_id = 1 [
    (google.api.field_behavior) = OUTPUT_ONLY,
    (google.api.field_behavior) = REQUIRED
  ];
  string family_stat_id = 2 [
    (google.api.field_behavior) = OUTPUT_ONLY,
    (google.api.field_behavior) = REQUIRED
  ];
  // T-0 Alignment ID to align the data for stat calculation.
  // When creating a family stat with a new Family, this field should contain the temporary_id
  // from FamilyAlignment.family_alignment_id. The service will resolve it to the actual alignment ID.
  // When updating a family stat, this field must contain the actual family_alignment_id.
  string family_alignment_id = 3 [(google.api.field_behavior) = REQUIRED];
  // Unique name for the family stat range.
  string name = 4 [
    (google.api.field_behavior) = OUTPUT_ONLY,
    (google.api.field_behavior) = REQUIRED
  ];
  // The start of the window for the stat calculation.
  // The start is an alignment ID and a duration relative to the alignment.
  // Defaults to T-0 alignment and 0 seconds.
  optional WindowType window_start = 5 [(google.api.field_behavior) = OPTIONAL];
  // The end of the window for the stat calculation.
  // The end is an alignment ID and a duration relative to the alignment.
  // Defaults to T-0 alignment and 0 seconds. However, window end must be after window start.
  // Service provides basic validation: if window_start.family_alignment_id = window_end.family_alignment_id, then window_start.duration < window_end.duration.
  optional WindowType window_end = 6 [(google.api.field_behavior) = OPTIONAL];
}

message FamilyStatDetails {
  FamilyStat family_stat = 1 [(google.api.field_behavior) = REQUIRED];
  repeated FamilyStatExpression family_stat_expressions = 2 [(google.api.field_behavior) = REQUIRED];
  repeated FamilyStatChannel family_stat_channels = 3 [(google.api.field_behavior) = OPTIONAL];
  repeated FamilyStatRange family_stat_ranges = 4 [(google.api.field_behavior) = REQUIRED];
}

message GetFamilyStatRequest {
  string family_stat_id = 1 [(google.api.field_behavior) = REQUIRED];
}

message GetFamilyStatResponse {
  FamilyStatDetails family_stat_details = 1 [(google.api.field_behavior) = REQUIRED];
}

message GetFamilyStatsRequest {
  string family_version_id = 1 [(google.api.field_behavior) = REQUIRED];
}

message GetFamilyStatsResponse {
  repeated FamilyStatDetails family_stats_details = 1 [(google.api.field_behavior) = REQUIRED];
}

message CreateFamilyStatRangesRequest {
  repeated string family_stat_ids = 1 [(google.api.field_behavior) = REQUIRED];
  repeated FamilyStatRange family_stat_ranges = 2 [(google.api.field_behavior) = REQUIRED];
}

message CreateFamilyStatRangesResponse {
  string family_version_id = 1 [(google.api.field_behavior) = REQUIRED];
  FamilyDetails family = 2 [(google.api.field_behavior) = REQUIRED];
  repeated FamilyStatDetails family_stats = 3 [(google.api.field_behavior) = REQUIRED];
