syntax = "proto3";

package sift.common.type.v1;

import "google/api/field_behavior.proto";

option go_package = "azimuth/gen/protos/go/sift/common/type/v1;typev1pb";

message Organization {
  string organization_id = 1 [(google.api.field_behavior) = REQUIRED];
  string organization_name = 2 [(google.api.field_behavior) = REQUIRED];
  optional bool is_abac_enabled = 3 [(google.api.field_behavior) = OPTIONAL];
}
