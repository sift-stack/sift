syntax = "proto3";

package sift.artifacts.v1;

import "google/api/annotations.proto";
import "google/api/field_behavior.proto";
import "google/protobuf/struct.proto";
import "google/protobuf/timestamp.proto";
import "protoc-gen-openapiv2/options/annotations.proto";
import "sift/metadata/v1/metadata.proto";

option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_swagger) = {
  info: {title: "Artifact Service"}
};

// ArtifactService manages an organization-scoped, versioned generic artifact
// store. Content class decides whether content lives in remote_files or the
// version's JSON payload. Attachment and provenance are links, and metadata
// uses the shared metadata values (sift.metadata.v1). No conversation owns an
// artifact.
//
// Links are append-only and belong to the version they were written at. A
// version's rows are its complete link set: ATTACHED_TO rows carry forward to
// each new version, while SOURCE and DERIVED_FROM rows are a closed account of
// one version's inputs. Linking and unlinking write a new version whose
// content is copied from the previous one.
//
// Artifact bytes live in remote_files (entity_type 'artifact_versions',
// entity_id = artifact_version_id): upload via the remote-files multipart
// endpoint, download via RemoteFileService.GetRemoteFileDownloadUrl.
service ArtifactService {
  // Creates an artifact plus its version-1 entry, or appends a version when
  // artifact_id is set. When conversation_id is set on create, the new
  // artifact is also linked to that conversation.
  rpc CreateArtifact(CreateArtifactRequest) returns (CreateArtifactResponse) {
    option (google.api.http) = {
      post: "/api/v1/artifacts"
      body: "*"
    };
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      summary: "CreateArtifact"
      description: "Create a new artifact or append a version to an existing one."
      operation_id: "ArtifactService_CreateArtifactV1"
    };
  }

  // Resolves to the latest version unless artifact_version_id pins one.
  rpc GetArtifact(GetArtifactRequest) returns (GetArtifactResponse) {
    option (google.api.http) = {get: "/api/v1/artifacts/{artifact_id}"};
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      summary: "GetArtifact"
      description: "Get one artifact, resolved to the latest version unless artifact_version_id pins one."
      operation_id: "ArtifactService_GetArtifactV1"
    };
  }

  // One entry per artifact, resolved to its latest version, oldest first.
  // With conversation_id set, only artifacts linked to that conversation;
  // otherwise every artifact in the caller's organization.
  rpc ListArtifacts(ListArtifactsRequest) returns (ListArtifactsResponse) {
    option (google.api.http) = {get: "/api/v1/artifacts"};
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      summary: "ListArtifacts"
      description: "List artifacts in the caller's organization, optionally filtered to one conversation."
      operation_id: "ArtifactService_ListArtifactsV1"
    };
  }

  // Full version history of one artifact, newest first.
  rpc ListArtifactVersions(ListArtifactVersionsRequest) returns (ListArtifactVersionsResponse) {
    option (google.api.http) = {get: "/api/v1/artifacts/{artifact_id}/versions"};
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      summary: "ListArtifactVersions"
      description: "List the version history of one artifact, newest first."
      operation_id: "ArtifactService_ListArtifactVersionsV1"
    };
  }

  // Links an existing artifact to a conversation, writing an ATTACHED_TO link
  // to a CONVERSATION entity. Idempotent: linking an already-linked pair
  // succeeds without effect.
  rpc LinkArtifactToConversation(LinkArtifactToConversationRequest) returns (LinkArtifactToConversationResponse) {
    option (google.api.http) = {post: "/api/v1/artifacts/{artifact_id}/conversations/{conversation_id}:link"};
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      summary: "LinkArtifactToConversation"
      description: "Link an existing artifact to a conversation."
      operation_id: "ArtifactService_LinkArtifactToConversationV1"
    };
  }

  // Removes one conversation's ATTACHED_TO link to an artifact. The artifact
  // itself is untouched. Idempotent: unlinking a missing link succeeds.
  rpc UnlinkArtifactFromConversation(UnlinkArtifactFromConversationRequest) returns (UnlinkArtifactFromConversationResponse) {
    option (google.api.http) = {post: "/api/v1/artifacts/{artifact_id}/conversations/{conversation_id}:unlink"};
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      summary: "UnlinkArtifactFromConversation"
      description: "Remove a conversation's link to an artifact."
      operation_id: "ArtifactService_UnlinkArtifactFromConversationV1"
    };
  }

  // Sets archived_date. Versions, bytes, and links are
  // left in place. Idempotent: archiving an already-archived artifact
  // succeeds without changing archived_date.
  rpc ArchiveArtifact(ArchiveArtifactRequest) returns (ArchiveArtifactResponse) {
    option (google.api.http) = {post: "/api/v1/artifacts/{artifact_id}/archive"};
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      summary: "ArchiveArtifact"
      description: "Archive an artifact. Versions, bytes, and links are left in place."
      operation_id: "ArtifactService_ArchiveArtifactV1"
    };
  }

  // Clears archived_date. Idempotent: unarchiving an active artifact
  // succeeds without effect.
  rpc UnarchiveArtifact(UnarchiveArtifactRequest) returns (UnarchiveArtifactResponse) {
    option (google.api.http) = {post: "/api/v1/artifacts/{artifact_id}/unarchive"};
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      summary: "UnarchiveArtifact"
      description: "Unarchive an artifact."
      operation_id: "ArtifactService_UnarchiveArtifactV1"
    };
  }
}

enum ArtifactAuthoringKind {
  ARTIFACT_AUTHORING_KIND_UNSPECIFIED = 0;
  ARTIFACT_AUTHORING_KIND_AGENT = 1;
  ARTIFACT_AUTHORING_KIND_USER = 2;
}

enum ArtifactStorageClass {
  // The content class is not specified.
  ARTIFACT_STORAGE_CLASS_UNSPECIFIED = 0;
  // Bytes in remote_files, previewable by MIME type.
  ARTIFACT_STORAGE_CLASS_FILE = 1;
  // Content is the JSON payload, no file.
  ARTIFACT_STORAGE_CLASS_STRUCTURED = 2;
  // Bytes in remote_files, opaque, download only.
  ARTIFACT_STORAGE_CLASS_BLOB = 3;
}

// Which surface wrote the artifact, independent of authoring_kind (who is accountable).
enum ArtifactCreatedVia {
  // The producing surface is not specified.
  ARTIFACT_CREATED_VIA_UNSPECIFIED = 0;
  // An agent wrote the artifact.
  ARTIFACT_CREATED_VIA_AGENT = 1;
  // Canvas wrote the artifact.
  ARTIFACT_CREATED_VIA_CANVAS = 2;
  // A direct upload wrote the artifact.
  ARTIFACT_CREATED_VIA_UPLOAD = 3;
}

enum ArtifactLinkRelation {
  // The link relation is not specified.
  ARTIFACT_LINK_RELATION_UNSPECIFIED = 0;
  // Placement, where the artifact surfaces.
  ARTIFACT_LINK_RELATION_ATTACHED_TO = 1;
  // Provenance, what the artifact was produced from; immutable.
  ARTIFACT_LINK_RELATION_SOURCE = 2;
  // Artifact-to-artifact.
  ARTIFACT_LINK_RELATION_DERIVED_FROM = 3;
}

// The kind of entity an artifact link points at. entity_id is opaque: a UUID
// for Sift entities, or the provider tool_use_id for TOOL_USE.
enum ArtifactEntityType {
  // The entity type is not specified.
  ARTIFACT_ENTITY_TYPE_UNSPECIFIED = 0;
  ARTIFACT_ENTITY_TYPE_CONVERSATION = 1;
  ARTIFACT_ENTITY_TYPE_CANVAS = 2;
  ARTIFACT_ENTITY_TYPE_RUN = 3;
  ARTIFACT_ENTITY_TYPE_ASSET = 4;
  ARTIFACT_ENTITY_TYPE_ARTIFACT = 5;
  ARTIFACT_ENTITY_TYPE_TOOL_USE = 6;
}

// Container fields flattened together with one resolved version.
message Artifact {
  string artifact_id = 1 [(google.api.field_behavior) = OUTPUT_ONLY];
  string organization_id = 2 [(google.api.field_behavior) = OUTPUT_ONLY];
  string created_by_user_id = 3 [(google.api.field_behavior) = OUTPUT_ONLY];
  ArtifactAuthoringKind authoring_kind = 5 [(google.api.field_behavior) = OUTPUT_ONLY];
  google.protobuf.Timestamp created_date = 6 [(google.api.field_behavior) = OUTPUT_ONLY];
  string artifact_version_id = 7 [(google.api.field_behavior) = OUTPUT_ONLY];
  uint32 version = 8 [(google.api.field_behavior) = OUTPUT_ONLY];
  optional string title = 9 [(google.api.field_behavior) = OUTPUT_ONLY];
  optional string summary = 10 [(google.api.field_behavior) = OUTPUT_ONLY];
  // Set only for versions authored inside a conversation, and there only
  // after the introducing message persists: uploads attach before the user
  // sends, and agent turns persist messages only at end of turn.
  optional string authoring_message_id = 11 [(google.api.field_behavior) = OUTPUT_ONLY];
  repeated string source_tool_use_ids = 12 [(google.api.field_behavior) = OUTPUT_ONLY];
  // Unset until bytes are uploaded.
  optional string remote_file_id = 13 [(google.api.field_behavior) = OUTPUT_ONLY];
  google.protobuf.Timestamp version_created_date = 14 [(google.api.field_behavior) = OUTPUT_ONLY];
  // From the version's remote_files record. Unset until bytes are uploaded.
  // Clients infer preview behavior from file_name / file_mime_type.
  optional string file_name = 15 [(google.api.field_behavior) = OUTPUT_ONLY];
  optional string file_mime_type = 16 [(google.api.field_behavior) = OUTPUT_ONLY];
  // Unset while the artifact is active.
  optional google.protobuf.Timestamp archived_date = 17 [(google.api.field_behavior) = OUTPUT_ONLY];
  ArtifactStorageClass storage_class = 18 [(google.api.field_behavior) = OUTPUT_ONLY];
  ArtifactCreatedVia created_via = 19 [(google.api.field_behavior) = OUTPUT_ONLY];
  // Set by GetArtifact for STRUCTURED artifacts. ListArtifacts omits it.
  optional google.protobuf.Struct payload = 20 [(google.api.field_behavior) = OUTPUT_ONLY];
  // Metadata attached to the resolved version.
  repeated sift.metadata.v1.MetadataValue metadata = 21 [(google.api.field_behavior) = OUTPUT_ONLY];
}

message ArtifactVersion {
  string artifact_version_id = 1 [(google.api.field_behavior) = OUTPUT_ONLY];
  string artifact_id = 2 [(google.api.field_behavior) = OUTPUT_ONLY];
  uint32 version = 3 [(google.api.field_behavior) = OUTPUT_ONLY];
  optional string title = 4 [(google.api.field_behavior) = OUTPUT_ONLY];
  optional string summary = 5 [(google.api.field_behavior) = OUTPUT_ONLY];
  optional string authoring_message_id = 6 [(google.api.field_behavior) = OUTPUT_ONLY];
  repeated string source_tool_use_ids = 7 [(google.api.field_behavior) = OUTPUT_ONLY];
  optional string remote_file_id = 8 [(google.api.field_behavior) = OUTPUT_ONLY];
  google.protobuf.Timestamp created_date = 9 [(google.api.field_behavior) = OUTPUT_ONLY];
  // From the version's remote_files record. Unset until bytes are uploaded.
  optional string file_name = 10 [(google.api.field_behavior) = OUTPUT_ONLY];
  optional string file_mime_type = 11 [(google.api.field_behavior) = OUTPUT_ONLY];
  // Set by GetArtifact for STRUCTURED artifacts. ListArtifactVersions omits it.
  optional google.protobuf.Struct payload = 12 [(google.api.field_behavior) = OUTPUT_ONLY];
  // Metadata attached to this version.
  repeated sift.metadata.v1.MetadataValue metadata = 13 [(google.api.field_behavior) = OUTPUT_ONLY];
}

// One link to write at the new version.
message ArtifactLinkInput {
  ArtifactLinkRelation relation = 1 [(google.api.field_behavior) = REQUIRED];
  ArtifactEntityType entity_type = 2 [(google.api.field_behavior) = REQUIRED];
  string entity_id = 3 [(google.api.field_behavior) = REQUIRED];
}

message CreateArtifactRequest {
  // Set to append a version to an existing artifact; unset to create one.
  optional string artifact_id = 1 [(google.api.field_behavior) = OPTIONAL];
  // Set to link the new artifact to a conversation at create time. Legal
  // only on create (not on append), and only for the conversation's author.
  // Equivalent to a links entry with relation ATTACHED_TO, entity_type
  // CONVERSATION, and this conversation_id as entity_id.
  optional string conversation_id = 2 [(google.api.field_behavior) = OPTIONAL];
  optional string title = 4 [(google.api.field_behavior) = OPTIONAL];
  optional string summary = 5 [(google.api.field_behavior) = OPTIONAL];
  // Defaults to USER. AGENT is self-reported: the agent pod authenticates
  // with the requesting user's transient key, so until scoped pod
  // credentials land, authorship attribution rides on the same
  // trust as the pod's message persistence path.
  optional ArtifactAuthoringKind authoring_kind = 6 [(google.api.field_behavior) = OPTIONAL];
  // A container field. Legal on create and defaults to FILE when unset. On
  // append, it must match the container.
  optional ArtifactStorageClass storage_class = 7 [(google.api.field_behavior) = OPTIONAL];
  // A container field. Ignored on append. Defaults to AGENT when unset on
  // create.
  optional ArtifactCreatedVia created_via = 8 [(google.api.field_behavior) = OPTIONAL];
  // Required for STRUCTURED and rejected otherwise. The serialized payload
  // must not exceed 1 MiB.
  optional google.protobuf.Struct payload = 9 [(google.api.field_behavior) = OPTIONAL];
  // Links written at the new version. On append, the previous version's
  // ATTACHED_TO rows carry forward and these are added to them.
  repeated ArtifactLinkInput links = 10 [(google.api.field_behavior) = OPTIONAL];
  // Metadata attached to the created version.
  repeated sift.metadata.v1.MetadataValue metadata = 11 [(google.api.field_behavior) = OPTIONAL];
}

message CreateArtifactResponse {
  Artifact artifact = 1 [(google.api.field_behavior) = OUTPUT_ONLY];
}

message GetArtifactRequest {
  string artifact_id = 1 [(google.api.field_behavior) = REQUIRED];
  optional string artifact_version_id = 2 [(google.api.field_behavior) = OPTIONAL];
}

message GetArtifactResponse {
  Artifact artifact = 1 [(google.api.field_behavior) = OUTPUT_ONLY];
}

message ListArtifactsRequest {
  // Unset lists every artifact in the caller's organization.
  optional string conversation_id = 1 [(google.api.field_behavior) = OPTIONAL];
  uint32 page_size = 2 [(google.api.field_behavior) = OPTIONAL];
  string page_token = 3 [(google.api.field_behavior) = OPTIONAL];
  // When false (the default), archived artifacts are omitted.
  //
  // Deprecated: use the `include_archived` directive in `filter` instead. This
  // field still works, and a filter that names the directive overrides it.
  bool include_archived = 4 [
    deprecated = true,
    (google.api.field_behavior) = OPTIONAL
  ];
  // A [Common Expression Language (CEL)](https://github.com/google/cel-spec)
  // filter string. Available fields are artifact_id, organization_id,
  // created_by_user_id, authoring_kind, storage_class, created_via,
  // title, version, created_date, archived_date, the include_archived
  // directive, and metadata through `metadata["<key>"]`. Links can be filtered
  // with a comprehension such as `links.exists(l, l.relation == "ATTACHED_TO"
  // && l.entity_type == "CONVERSATION" && l.entity_id == "<id>")`. Link
  // sub-fields are relation, entity_type, entity_id, and artifact_version_id.
  // Enum fields compare against proto value names without the prefix, for
  // example `storage_class == "STRUCTURED"`, `relation == "ATTACHED_TO"`, and
  // `entity_type == "CONVERSATION"`. The
  // conversation_id and include_archived fields on this message keep working
  // and combine with filter.
  string filter = 5 [(google.api.field_behavior) = OPTIONAL];
  // A comma-separated [AIP-132](https://google.aip.dev/132#ordering) ordering
  // string over created_date, archived_date, title, and version. Fields
  // sort ascending by default and support a `desc` suffix. The default is
  // created_date ascending.
  string order_by = 6 [(google.api.field_behavior) = OPTIONAL];
}

message ListArtifactsResponse {
  repeated Artifact artifacts = 1 [(google.api.field_behavior) = OUTPUT_ONLY];
  string next_page_token = 2 [(google.api.field_behavior) = OUTPUT_ONLY];
}

message ListArtifactVersionsRequest {
  string artifact_id = 1 [(google.api.field_behavior) = REQUIRED];
  uint32 page_size = 2 [(google.api.field_behavior) = OPTIONAL];
  string page_token = 3 [(google.api.field_behavior) = OPTIONAL];
}

message ListArtifactVersionsResponse {
  repeated ArtifactVersion versions = 1 [(google.api.field_behavior) = OUTPUT_ONLY];
  string next_page_token = 2 [(google.api.field_behavior) = OUTPUT_ONLY];
}

message LinkArtifactToConversationRequest {
  string artifact_id = 1 [(google.api.field_behavior) = REQUIRED];
  string conversation_id = 2 [(google.api.field_behavior) = REQUIRED];
}

message LinkArtifactToConversationResponse {}

message UnlinkArtifactFromConversationRequest {
  string artifact_id = 1 [(google.api.field_behavior) = REQUIRED];
  string conversation_id = 2 [(google.api.field_behavior) = REQUIRED];
}

message UnlinkArtifactFromConversationResponse {}

message ArchiveArtifactRequest {
  string artifact_id = 1 [(google.api.field_behavior) = REQUIRED];
}

message ArchiveArtifactResponse {}

message UnarchiveArtifactRequest {
  string artifact_id = 1 [(google.api.field_behavior) = REQUIRED];
}

message UnarchiveArtifactResponse {}
