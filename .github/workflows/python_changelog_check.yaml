name: python-changelog-check

# Every pull request that changes python/ must add a changelog fragment in python/changelog.d.
# An empty <PR>.chore.md fragment marks a change with no user-visible effect.
# See python/changelog.d/README.md.

on:
  pull_request:
    paths:
      - 'python/**'

permissions:
  contents: read

jobs:
  fragment:
    name: Changelog fragment
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install towncrier
        run: pip install "towncrier==26.9.0"

      - name: Check for a fragment
        run: towncrier check --dir python --config python/pyproject.toml --compare-with "origin/${{ github.base_ref }}"

      # A release PR renders and deletes every fragment. A fragment in the merge result means
      # another change merged after the release PR was opened and would ship without an entry.
      - name: Check that a release PR includes every fragment
        run: |
          if git diff "origin/${{ github.base_ref }}...HEAD" -- python/CHANGELOG.md | grep -q '^+## \[v'; then
            fragments=$(find python/changelog.d -type f ! -name README.md ! -name template.md.jinja)
            if [[ -n "$fragments" ]]; then
              echo "Error: fragments merged after this release PR was opened:"
              echo "$fragments"
              echo "Close this PR and run Python Release Prep again."
              exit 1
            fi
          fi

      - name: Check that the fragments render
        run: towncrier build --dir python --config python/pyproject.toml --draft --version 0.0.0 --date "Draft" > /dev/null
